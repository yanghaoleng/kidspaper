server {
    listen 80;
    listen [::]:80;
    server_name partner.mikeywa.site;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name partner.mikeywa.site;
    ssl_certificate /etc/letsencrypt/live/partner.mikeywa.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partner.mikeywa.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    charset utf-8;
    access_log off;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:8817;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
